services:
  - type: web
    name: tender-finder-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/system/health
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-120b:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/tender_finder.db
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: SEARCH_PROVIDER
        value: duckduckgo
      - key: MAX_SEARCH_RESULTS
        value: "8"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "20"
      - key: API_HOST
        value: 0.0.0.0
